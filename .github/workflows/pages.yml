name: Publish UIUX Spec

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'bin/**'
      - 'design/**'
      - 'server/**'
      - 'src/**'
      - 'nuxt.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build published UIUX spec
        run: >-
          node ./bin/uiux.mjs publish
          --workspace design
          --out .pages
          --base /uiux/
          --source-revision "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
